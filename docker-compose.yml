# Backend developer:  docker compose up -d db                     (local DB only, backend runs from .venv)
# Frontend developer: docker compose --profile app up -d --build  (backend container, mock AI)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drawtale
      POSTGRES_PASSWORD: drawtale
      POSTGRES_DB: drawtale
    ports:
      - "127.0.0.1:5433:5432"   # host 5433: avoids clashing with a locally installed PostgreSQL
    volumes:
      - drawtale_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawtale"]
      interval: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: on-failure
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage

volumes:
  drawtale_pg:
