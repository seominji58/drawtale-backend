# Local development DB only. Backend runs with .venv + uvicorn --reload.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drawtale
      POSTGRES_PASSWORD: drawtale
      POSTGRES_DB: drawtale
    ports:
      - "127.0.0.1:5433:5432"   # host 5433: avoids clashing with a locally installed PostgreSQL
    volumes:
      - drawtale_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawtale"]
      interval: 5s
      retries: 10

volumes:
  drawtale_pg:
